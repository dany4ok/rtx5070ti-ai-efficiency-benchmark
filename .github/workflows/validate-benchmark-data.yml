name: Validate benchmark data
on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate_benchmarks.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check CSV structure, required fields, and tokens/J arithmetic
        run: python scripts/validate_benchmarks.py data/*.csv

